<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lino's Password Game</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@700&family=Roboto:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
   <a id="icon" href="../" aria-label="Back to linolv.github.io">
    <img src="../icon.png" alt="">
   </a>
<div id="app">
    <div id="gameScreen">
        <h1><br>Lino's Password Game</h1>
        <input type="text" id="password_field" placeholder="Start typing your password" autocomplete="off">
        <div id="char_count">Characters: 0</div>
        <div id="label_message"></div>
        
        <div class="social-buttons" data-social-buttons></div>
    </div>

    <div id="winScreen">
        <div id="winTitle">YOU WON!</div>
        <div id="winSub">Thanks for Playing Lino's Password Game</div>
        <div class="social-buttons" data-social-buttons></div>
    </div>
</div>

<div id="footer">
    <p>
        Copyright &copy; 2026 LinoLV.github.io.
        Licensed under the <a href="https://raw.githubusercontent.com/LinoLV/linolv.github.io/refs/heads/main/LICENSE" target="_blank" rel="noopener noreferrer">GNU GPL-3.0</a>.
        <a href="https://github.com/LinoLV/linolv.github.io/tree/main/passwordgame" target="_blank" rel="noopener noreferrer">Source Code</a>.
    </p>
</div>

<template id="socialButtonsTemplate">
    <a href="https://buymeacoffee.com/linolv"
       target="_blank"
       rel="noopener noreferrer"
       class="social-btn bmc-social"
       aria-label="Buy me a coffee">
        <img src="buymeacoffee.png" alt="">
        <span>Buy me a coffee</span>
    </a>

    <a href="https://youtube.com/@linolv"
       target="_blank"
       rel="noopener noreferrer"
       class="social-btn youtube-social"
       aria-label="YouTube">
        <img src="youtube.png" alt="">
        <span>YouTube</span>
    </a>
</template>

<audio id="errorSound" src="./sounds/error.mp3" preload="auto"></audio>
<audio id="completeSound" src="./sounds/complete.mp3" preload="auto"></audio>
<audio id="popperSound" src="https://sfxmint.com/dl/party-popper-01.mp3" preload="auto"></audio>

<script src="script.js"></script>
</body>
</html>
