<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stop exactly at 10 seconds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Roboto:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Aldo the Apache';
    src: url('../aldo-the-apache.woff') format('woff');
    font-weight: 400;
    font-display: swap;
  }

  @font-face {
    font-family: 'CopperplateCC';
    src: url('copperplate-bold.ttf') format('truetype');
    font-weight: 700;
    font-display: swap;
  }

  :root {
    --bg: #040706;
    --lime: #35c46e;
    --lime-bright: #5ce08a;
    --blue: #3f9bf5;
    --blue-soft: #79b9f7;
    --stop: #d92d47;
    --stop-bright: #ef4b63;
    --text: var(--lime);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, #0e1a12 0%, var(--bg) 65%);
    color: var(--text);
    font-family: 'Roboto', sans-serif;
    font-weight: 700;
    padding: 95px 20px 60px;
    text-align: center;
  }

  .home-link {
    position: fixed;
    top: 18px;
    left: 18px;
    z-index: 10;
    display: inline-block;
    line-height: 0;
    transition: transform 0.18s ease;
  }
  .home-link img {
    width: 56px;
    height: 56px;
    display: block;
    object-fit: contain;
  }
  .home-link:hover { transform: scale(1.12); }

  .more-link {
    position: fixed;
    bottom: 18px;
    right: 18px;
    z-index: 10;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 34px;
    padding: 0 12px;
    border-radius: 9px;
    background: var(--lime);
    color: #071207;
    font-family: 'Roboto', Arial, sans-serif;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 0.08em;
    text-decoration: none;
    white-space: nowrap;
    box-shadow: 0 0 8px rgba(53, 196, 110, 0.9),
                0 0 26px rgba(53, 196, 110, 0.55);
    transition: background 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
  }
  .more-link:hover {
    background: var(--lime-bright);
    box-shadow: 0 0 12px rgba(92, 224, 138, 1),
                0 0 38px rgba(53, 196, 110, 0.75);
    transform: translateY(-1px);
  }

  main { width: min(620px, 100%); }

  h1 {
    margin: 0 0 26px;
    font-family: 'Aldo the Apache', cursive;
    font-weight: 400;
    font-size: clamp(1.4rem, 6.4vw, 2.9rem);
    white-space: nowrap;
    line-height: 1.2;
    color: #ffffff;
  }

  button#mainBtn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 130px;
    height: 130px;
    margin: 0 auto;
    padding: 0;
    font-family: 'Archivo Black', 'Arial Black', sans-serif;
    font-size: 1.8rem;
    font-weight: 400;
    line-height: 1;
    letter-spacing: 0;
    color: #0a1400;
    background: var(--lime);
    border: 1px solid var(--lime-bright);
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 0 8px rgba(53, 196, 110, 0.9),
                0 0 26px rgba(53, 196, 110, 0.55),
                inset 0 0 14px rgba(255, 255, 255, 0.35);
    transition: background 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
  }
  button#mainBtn:hover {
    background: var(--lime-bright);
    box-shadow: 0 0 12px rgba(92, 224, 138, 1),
                0 0 38px rgba(53, 196, 110, 0.75),
                inset 0 0 16px rgba(255, 255, 255, 0.45);
  }
  button#mainBtn:active { transform: scale(0.96); }
  button#mainBtn.stop {
    background: var(--stop);
    border-color: #f26b7c;
    color: #2a050c;
    box-shadow: 0 0 10px rgba(217, 45, 71, 0.9),
                0 0 28px rgba(217, 45, 71, 0.55),
                inset 0 0 14px rgba(255, 255, 255, 0.3);
  }
  button#mainBtn.stop:hover { background: var(--stop-bright); }

  .status {
    margin: 10px 0 0;
    font-size: 1.15rem;
  }
  .status:empty { display: none; }
  .status.running {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    color: var(--lime);
  }
  .status.running::before {
    content: "";
    flex: 0 0 auto;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--lime);
    box-shadow: 0 0 10px var(--lime);
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: 0.25; } }

  .results {
    margin-top: 8px;
    animation: fadeIn 0.25s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }

  .time {
    margin-top: 4px;
    font-size: 1.8rem;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    letter-spacing: -1px;
    color: var(--blue);
    text-shadow: 0 0 16px rgba(63, 155, 245, 0.45);
  }
  .percent {
    font-size: 2.2rem;
    font-weight: 900;
    color: var(--lime);
    text-shadow: 0 0 16px rgba(53, 196, 110, 0.5);
  }
  .message {
    margin-top: 6px;
    font-size: 1.05rem;
    color: var(--blue-soft);
  }
  .high {
    margin: 0 0 20px;
    font-family: 'CopperplateCC', Copperplate, serif;
    font-size: 1.9rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--lime-bright);
    text-shadow: 0 0 4px rgba(92, 224, 138, 0.7),
                 0 0 12px rgba(53, 196, 110, 0.55),
                 0 0 26px rgba(53, 196, 110, 0.3);
    transform-origin: center center;
    backface-visibility: hidden;
    will-change: transform;
  }
  .high.pop {
    animation: bestPop 0.85s cubic-bezier(0.22, 1.2, 0.36, 1) both,
               bestPulse 1.1s ease-in-out 0.85s infinite alternate;
  }
  @keyframes bestPop {
    0% { opacity: 0; transform: translateY(-30px) scale3d(0.8, 0.8, 1); }
    55% { opacity: 1; transform: translateY(6px) scale3d(1.14, 1.14, 1); }
    75% { transform: translateY(-4px) scale3d(0.98, 0.98, 1); }
    100% { opacity: 1; transform: translateY(0) scale3d(1, 1, 1); }
  }
  @keyframes bestPulse {
    from { transform: scale3d(1, 1, 1); }
    to { transform: scale3d(1.12, 1.12, 1); }
  }
  .best {
    margin-top: 4px;
    font-size: 0.9rem;
    color: var(--blue-soft);
  }

  .hidden { display: none; }

  #confettiCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 9999;
  }

  footer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 10px;
    padding: 0 16px;
    z-index: 5;
  }
  .legal {
    margin: 0;
    text-align: center;
    font-family: 'Roboto', sans-serif;
    font-weight: 300;
    font-size: 12px;
    line-height: 1.5;
    color: #8b949e;
  }
  .legal a {
    color: inherit;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .legal a:hover { color: var(--lime); }
</style>
</head>
<body>

<audio id="popperSound" src="https://sfxmint.com/dl/party-popper-01.mp3" preload="auto"></audio>

<a class="home-link" href="https://linolv.github.io" aria-label="Go to linolv.github.io">
  <img src="../icon.png" alt="Home">
</a>

<a class="more-link" href="https://linolv.github.io" title="More games">More Games</a>

<main>
  <h1>Stop exactly at 10 seconds</h1>

  <div id="highScore" class="high hidden"></div>

  <button id="mainBtn" type="button">GO</button>
  <p id="status" class="status"></p>

  <section id="results" class="results hidden" aria-live="polite">
    <div id="percentText" class="percent"></div>
    <div id="timeText" class="time"></div>
    <div id="message" class="message"></div>
    <div id="bestScore" class="best"></div>
  </section>
</main>

<footer>
  <p class="legal">
    Copyright &copy; 2026 LinoLV.github.io.
    Licensed under the <a href="https://raw.githubusercontent.com/LinoLV/linolv.github.io/refs/heads/main/LICENSE" target="_blank" rel="noopener noreferrer">GNU GPL-3.0</a>.
    <a href="https://github.com/LinoLV/linolv.github.io/tree/main/tenseconds" target="_blank" rel="noopener noreferrer">Source Code</a>.
  </p>
</footer>

<script>
(function () {
  'use strict';

  const btn = document.getElementById('mainBtn');
  const statusEl = document.getElementById('status');
  const results = document.getElementById('results');
  const timeText = document.getElementById('timeText');
  const percentText = document.getElementById('percentText');
  const messageEl = document.getElementById('message');
  const highScoreEl = document.getElementById('highScore');
  const bestScoreEl = document.getElementById('bestScore');
  const popperSound = document.getElementById('popperSound');

  let running = false;
  let startTime = 0;
  let attempts = 0;
  let bestPercent = null;

  let audioCtx = null;
  let musicTimer = null;
  let nextNoteTime = 0;
  let noteIndex = 0;
  const TUNE = [261.63, 329.63, 392.00, 329.63, 293.66, 349.23, 440.00, 349.23];

  function ensureAudio() {
    if (audioCtx) return true;
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return false;
    audioCtx = new AudioContextClass();
    return true;
  }

  function playTone(frequency, when, duration, volume, destination) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(frequency, when);
    gain.gain.setValueAtTime(0.0001, when);
    gain.gain.linearRampToValueAtTime(volume, when + 0.06);
    gain.gain.exponentialRampToValueAtTime(0.0001, when + duration);
    osc.connect(gain);
    gain.connect(destination || audioCtx.destination);
    osc.start(when);
    osc.stop(when + duration + 0.05);
  }

  function scheduleTune() {
    while (nextNoteTime < audioCtx.currentTime + 0.25) {
      playTone(TUNE[noteIndex % TUNE.length], nextNoteTime, 0.55, 0.06);
      nextNoteTime += 0.55;
      noteIndex++;
    }
  }

  function startMusic() {
    if (!ensureAudio()) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    nextNoteTime = audioCtx.currentTime + 0.05;
    noteIndex = 0;
    scheduleTune();
    musicTimer = setInterval(scheduleTune, 120);
  }

  function stopMusic() {
    if (musicTimer) {
      clearInterval(musicTimer);
      musicTimer = null;
    }
  }

  function playWinSound() {
    if (!ensureAudio()) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const sfx = audioCtx.createGain();
    sfx.gain.value = 0.18;
    sfx.connect(audioCtx.destination);
    const base = audioCtx.currentTime + 0.05;
    [523.25, 659.25, 783.99, 1046.50].forEach(function (freq, i) {
      playTone(freq, base + i * 0.11, 0.32, 0.5, sfx);
    });
  }

  const CONFETTI_COLORS = ['#00FF00', '#CCFF00', '#00FFFF', '#FF00FF', '#FFD700', '#FF5555', '#FFFFFF', '#7CFFB2'];

  function playPartyPopper() {
    popperSound.currentTime = 0;
    popperSound.volume = 0.6;
    popperSound.play().catch(function () {});
    launchConfetti();
  }

  function launchConfetti() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if (document.getElementById('confettiCanvas')) return;

    const canvas = document.createElement('canvas');
    canvas.id = 'confettiCanvas';
    canvas.setAttribute('aria-hidden', 'true');
    document.body.appendChild(canvas);

    const ctx = canvas.getContext('2d');
    let width = 0;
    let height = 0;

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    resize();
    window.addEventListener('resize', resize);

    const pieces = [];
    const EMIT_MS = 4000;
    const SPAWN_INTERVAL = 20;
    let spawnTimer = 0;
    let elapsed = 0;
    let lastTime = performance.now();

    function spawn(x, y, minAngle, maxAngle) {
      const angle = (minAngle + Math.random() * (maxAngle - minAngle)) * Math.PI / 180;
      const speed = 15 + Math.random() * 11;
      pieces.push({
        x: x + (Math.random() - 0.5) * 24,
        y: y,
        vx: Math.cos(angle) * speed,
        vy: -Math.sin(angle) * speed,
        w: 5 + Math.random() * 6,
        h: 8 + Math.random() * 8,
        color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
        rotation: Math.random() * Math.PI * 2,
        rotationSpeed: (Math.random() - 0.5) * 0.32,
        flip: Math.random() * Math.PI * 2,
        flipSpeed: 0.08 + Math.random() * 0.16,
        age: 0,
        lifetime: 2600 + Math.random() * 1600
      });
    }

    function frame(now) {
      const dt = Math.min(now - lastTime, 50);
      lastTime = now;
      elapsed += dt;
      const step = dt / (1000 / 60);

      if (elapsed < EMIT_MS) {
        spawnTimer += dt;
        while (spawnTimer >= SPAWN_INTERVAL) {
          spawnTimer -= SPAWN_INTERVAL;
          spawn(0, height - 4, 55, 82);
          spawn(width, height - 4, 98, 125);
        }
      }

      ctx.clearRect(0, 0, width, height);

      for (let i = pieces.length - 1; i >= 0; i--) {
        const p = pieces[i];
        p.age += dt;

        if (p.age > p.lifetime || p.y > height + 60) {
          pieces.splice(i, 1);
          continue;
        }

        p.vy += 0.3 * step;
        p.vx *= Math.pow(0.99, step);
        p.vy *= Math.pow(0.99, step);
        p.x += p.vx * step;
        p.y += p.vy * step;
        p.rotation += p.rotationSpeed * step;
        p.flip += p.flipSpeed * step;

        const remaining = p.lifetime - p.age;
        ctx.globalAlpha = remaining < 700 ? remaining / 700 : 1;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.scale(1, Math.cos(p.flip));
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }

      ctx.globalAlpha = 1;

      if (elapsed < EMIT_MS || pieces.length > 0) {
        requestAnimationFrame(frame);
      } else {
        window.removeEventListener('resize', resize);
        canvas.remove();
      }
    }

    requestAnimationFrame(frame);
  }

  function start() {
    running = true;
    startTime = performance.now();
    attempts++;
    btn.textContent = 'Stop';
    btn.classList.add('stop');
    statusEl.textContent = 'Running';
    statusEl.classList.add('running');
    results.classList.add('hidden');
    highScoreEl.textContent = '';
    highScoreEl.classList.add('hidden');
    bestScoreEl.textContent = '';
    startMusic();
  }

  function scoreFor(elapsed) {
    const delta = Math.abs(elapsed - 10);
    const displayed = elapsed.toFixed(3).padStart(6, '0');
    const isPerfect = displayed === '10.000';
    const percent = isPerfect ? 100 : Math.max(0, Math.min(99.99, 100 - delta * 10));

    let message;
    if (isPerfect) message = 'You won! Perfect timing! 🎉';
    else if (percent >= 99.99) message = 'Almost there! Unbelievably close! 🎯';
    else if (percent >= 99.9) message = 'Almost there! 🔥';
    else if (percent >= 99) message = 'Almost there! 👀';
    else if (percent >= 95) message = 'Nice try! 👍';
    else if (percent >= 80) message = 'Not bad! 🙂';
    else message = 'Keep trying! 💪';

    return { percent: percent, message: message, displayed: displayed };
  }

  function formatPercent(percent) {
    if (percent === 100) return '100%';
    if (percent >= 99) return percent.toFixed(2) + '%';
    return percent.toFixed(1) + '%';
  }

  function stop() {
    running = false;
    const elapsed = (performance.now() - startTime) / 1000;
    stopMusic();
    btn.textContent = 'GO';
    btn.classList.remove('stop');
    statusEl.textContent = '';
    statusEl.classList.remove('running');

    const result = scoreFor(elapsed);
    const isNewBest = bestPercent === null || result.percent > bestPercent;
    if (isNewBest) bestPercent = result.percent;

    timeText.textContent = result.displayed + ' Seconds';
    percentText.textContent = formatPercent(result.percent);
    messageEl.textContent = result.message;

    if (isNewBest) {
      highScoreEl.textContent = 'New Best Score';
      highScoreEl.classList.remove('hidden', 'pop');
      void highScoreEl.offsetWidth;
      highScoreEl.classList.add('pop');
      bestScoreEl.textContent = '';
    } else {
      highScoreEl.classList.add('hidden');
      highScoreEl.textContent = '';
      bestScoreEl.textContent = 'Best: ' + bestPercent.toFixed(2) + '%';
    }

    if (result.percent > 95) playPartyPopper();
    else if (isNewBest) playWinSound();

    results.classList.remove('hidden');
  }

  btn.addEventListener('click', function () {
    if (running) stop();
    else start();
  });

  document.addEventListener('keydown', function (event) {
    if (event.code === 'Space' && event.target === document.body) {
      event.preventDefault();
      btn.click();
    }
  });
})();
</script>
</body>
</html>
