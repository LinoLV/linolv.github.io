<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LinoLV.github.io</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300&display=swap">
<link rel="stylesheet" href="https://fonts.cdnfonts.com/css/aldo-the-apache">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<img id="cornerIcon" src="icon.png" alt="LinoLV.github.io">

<main>
  <h1>LiNO LV</h1>
  <div class="tiles">
    <a class="tile" href="https://linolv.github.io/passwordgame" aria-label="Password Game">
      <img src="button1.png" width="945" height="945" alt="">
    </a>
    <a class="tile" href="https://linolv.github.io/driftingwords" aria-label="Drifting Words">
      <img src="button2.png" width="945" height="945" alt="">
    </a>
    <a class="tile" href="https://linolv.github.io/tenseconds" aria-label="tenseconds">
      <img src="button3.png" width="945" height="945" alt="">
    </a>
  </div>
</main>

<footer>
  <p class="legal">
    Copyright &copy; 2026 LinoLV.github.io.
    Licensed under the <a href="https://raw.githubusercontent.com/LinoLV/linolv.github.io/refs/heads/main/LICENSE" target="_blank" rel="noopener noreferrer">GNU GPL-3.0</a>.
    <a href="https://github.com/LinoLV/linolv.github.io" target="_blank" rel="noopener noreferrer">Source Code</a>.
  </p>
  <div class="footerActions">
  <button class="pill" id="themeBtn" type="button" aria-pressed="false" aria-label="Switch to light theme">
    <span class="badge" aria-hidden="true">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg>
    </span>
    <span class="label">Theme</span>
  </button>
  <a class="pill" href="https://www.buymeacoffee.com/linolv" target="_blank" rel="noopener noreferrer">
    <img class="coffeeIcon" src="passwordgame/buymeacoffee.png" alt="">
    <span class="label">Buy me a coffee</span>
  </a>
  </div>
</footer>

<script>
  (function () {
    var btn = document.getElementById("themeBtn");
    var root = document.documentElement;
    btn.addEventListener("click", function () {
      var light = root.getAttribute("data-theme") === "light";
      root.setAttribute("data-theme", light ? "dark" : "light");
      btn.setAttribute("aria-pressed", String(!light));
      btn.setAttribute("aria-label", light ? "Switch to light theme" : "Switch to dark theme");
    });
  })();
</script>

</body>
</html>
